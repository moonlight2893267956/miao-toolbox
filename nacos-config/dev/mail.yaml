spring:
  mail:
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:dev-placeholder}
    password: ${SMTP_PASSWORD:dev-placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

app:
  mail:
    from: ${MAIL_FROM:noreply@example.com}
    code:
      expire-minutes: 5
      max-send-per-hour: 5
      max-verify-per-day: 10
      length: 6
