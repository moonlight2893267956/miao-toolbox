<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1714" />
      <stop offset="100%" stop-color="#2a2318" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a97e" />
      <stop offset="100%" stop-color="#a8895e" />
    </linearGradient>
  </defs>

  <!-- 圆角方块（猫脸主体） -->
  <rect x="48" y="80" width="416" height="384" rx="104" ry="104" fill="url(#brandGradient)" />
  <!-- 主体边框金线 -->
  <rect x="48" y="80" width="416" height="384" rx="104" ry="104" fill="none" stroke="#c8a97e" stroke-width="3" opacity="0.35" />

  <!-- 左猫耳 -->
  <path d="M 120 130 L 110 40 L 180 95 Z" fill="#1a1714" />
  <path d="M 118 120 L 113 55 L 165 95 Z" fill="#c8a97e" opacity="0.85" />

  <!-- 右猫耳 -->
  <path d="M 392 130 L 402 40 L 332 95 Z" fill="#2a2318" />
  <path d="M 394 120 L 399 55 L 347 95 Z" fill="#c8a97e" opacity="0.85" />

  <!-- 工具箱主体 -->
  <rect x="146" y="236" width="220" height="170" rx="28" ry="28" fill="#c8a97e" opacity="0.9" />

  <!-- 工具箱提手 -->
  <path d="M 222 236 L 222 202 Q 222 182 242 182 L 270 182 Q 290 182 290 202 L 290 236"
        fill="none" stroke="#c8a97e" stroke-width="26" stroke-linecap="round" opacity="0.9" />

  <!-- 工具箱扣带 -->
  <rect x="200" y="296" width="112" height="22" rx="8" ry="8" fill="#1a1714" opacity="0.6" />
  <rect x="236" y="286" width="40" height="42" rx="8" ry="8" fill="#1a1714" opacity="0.7" />
</svg>
