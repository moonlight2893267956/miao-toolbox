  <!-- 文字「渺」 -->
  <text x="256" y="256" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="248" font-weight="700" fill="#ffffff"
        text-anchor="middle" dominant-baseline="central">渺</text>
</svg>
